[project]
name = "tijaratk-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "arq>=0.26.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "numpy>=2.5.2",
    "openai>=3.3.1",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "twilio>=9.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx2>=1.0.0",
    "respx>=0.23.1",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
